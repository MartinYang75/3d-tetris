name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 允许你在 GitHub 页面上点击按钮手动触发打包

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '3D Tetris v__VERSION__'
          releaseBody: '自动生成的 Windows 桌面版安装包与免安装程序'
          releaseDraft: false
          prerelease: false
